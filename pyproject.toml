[project]
name = "enterprise-rag"
version = "0.1.0"
description = "企业级智能知识库问答系统（RAG）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # LangChain 生态（1.x：旧版 LLMChain/ConversationalRetrievalChain 已弃用，只写 LCEL）
    "langchain-core>=1.6,<2",
    "langchain-deepseek==1.1.0",
    "langchain-openai>=1.0,<2",
    "langchain-chroma>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    # 后端与 UI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "streamlit>=1.40",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    # 文档解析
    "pymupdf>=1.25",
    "langchain-qdrant==1.1.0",
    "jieba>=0.42.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
